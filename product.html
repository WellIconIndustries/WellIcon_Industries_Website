<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Explore Well Icon everyday comfort and apparel.">
  <title>Product | WELL ICON</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css"><script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
  <div class="product-promo">Everyday essentials, made for your everyday</div>
  <header class="product-header">
    <a href="index.html" class="brand-wordmark" aria-label="Well Icon home">WELL <span>ICON</span></a>
    <nav aria-label="Main navigation"><a href="men.html">Men</a><a href="women.html">Women</a><a href="accessories.html">Accessories</a></nav>
    <div class="product-header-actions"><a href="wishlist.html" aria-label="Wishlist">♡ <span class="wishlist-count-badge">0</span></a><a href="cart.html" aria-label="Shopping Bag">Bag <span class="cart-count-badge">0</span></a></div>
  </header>
  <main class="product-detail-shell">
    <nav class="product-breadcrumb" aria-label="Breadcrumb"><a href="index.html">Home</a><span>/</span><span id="crumb-name">Product</span></nav>
    <div id="product-detail" class="product-detail-grid" aria-live="polite"><p class="product-loading">Loading product…</p></div>
  </main>
  <footer class="product-footer"><a href="index.html" class="brand-wordmark">WELL <span>ICON</span></a><p>Comfort for every day.</p><nav><a href="men.html">Men</a><a href="women.html">Women</a><a href="accessories.html">Accessories</a><a href="cart.html">Shopping bag</a></nav></footer>
  <div id="toast-container" class="toast-container" aria-live="polite"></div>
  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const product = window.wellIconGetProduct?.(new URLSearchParams(location.search).get('id'));
      const root = document.getElementById('product-detail');
      const money = value => `₹${Number(value || 0).toLocaleString('en-IN', {minimumFractionDigits:2, maximumFractionDigits:2})}`;
      if (!product) {
        root.innerHTML = `<div class="product-not-found"><h1>We couldn't find that product</h1><p>Explore the latest Well Icon collections.</p><a class="detail-primary-link" href="index.html">Continue shopping</a></div>`;
        return;
      }
      document.title = `${product.name} | WELL ICON`;
      document.getElementById('crumb-name').textContent = product.name;
      root.dataset.productId = product.id;
      const savedVariant = window.wellIconCartAPI?.getCart().find(item => item.id === product.id)?.variant || '';
      const sizeOptions = (product.availableSizes || ['One Size']).map(size => {
        const selected = size === savedVariant || ((product.availableSizes || []).length === 1 && size === 'One Size');
        return `<button class="size-btn${selected ? ' active selected' : ''}" type="button" data-size="${size}" aria-pressed="${selected}">${size}</button>`;
      }).join('');
      root.innerHTML = `<div class="product-detail-image"><img src="${product.image}" alt="${product.name}" onerror="this.onerror=null;this.src='images/hero_groove_banner.jpg'"></div>
        <section class="product-detail-info" aria-labelledby="detail-title"><p class="detail-eyebrow">${product.tag || 'WELL ICON ESSENTIALS'}</p>
        <h1 id="detail-title">${product.name}</h1><p class="detail-price">${money(product.price)}</p>
        <p class="detail-description">${product.desc || 'Explore this Well Icon everyday essential.'}</p>
        <fieldset class="detail-size-fieldset"><legend>Select a size</legend><div class="well-icon-size-picker" role="group" aria-label="Available sample sizes">${sizeOptions}</div><p class="detail-size-note">Sample catalogue sizing. Confirm available sizes with Well Icon before ordering.</p></fieldset>
        <div class="detail-quantity"><label for="product-qty">Quantity</label><input id="product-qty" type="number" min="1" max="99" value="1" inputmode="numeric"></div>
        <div class="detail-actions"><button id="product-detail-add-btn" class="cart-add-btn detail-add-btn" type="button"><span class="material-symbols-outlined" aria-hidden="true">shopping_bag</span>Add to bag</button><button class="buy-now-btn" type="button" data-action="buy-now">Buy now</button>
        <button class="wishlist-toggle-btn detail-wish-btn" type="button" aria-label="Add ${product.name} to wishlist" aria-pressed="false"><span class="material-symbols-outlined" aria-hidden="true">favorite_border</span></button></div>
        <p class="detail-note">No account is required. Orders are reviewed and submitted through the Well Icon order form.</p><div class="detail-policies"><p>Shipping and taxes are not calculated.</p><p>Order submission is pending until the form is completed and received.</p></div></section>`;
      root.querySelectorAll('.detail-size-fieldset [data-size]').forEach(option => {
        option.addEventListener('click', () => {
          root.querySelectorAll('.detail-size-fieldset [data-size]').forEach(other => {
            const selected = other === option;
            other.classList.toggle('active', selected);
            other.classList.toggle('selected', selected);
            other.setAttribute('aria-pressed', String(selected));
          });
          window.wellIconCartAPI?.updateCartUI();
        });
      });
      const relatedProducts = (window.wellIconListProducts?.() || []).filter(item => item.id !== product.id && item.category === product.category).slice(0, 4);
      if (relatedProducts.length) {
        const related = document.createElement('section');
        related.className = 'product-related';
        related.setAttribute('aria-labelledby', 'related-title');
        related.innerHTML = `<h2 id="related-title">More from this collection</h2><div class="product-related-grid">${relatedProducts.map(item => `<a class="product-related-card" href="product.html?id=${encodeURIComponent(item.id)}"><img src="${item.image}" alt="" loading="lazy" onerror="this.onerror=null;this.src='images/hero_groove_banner.jpg'"><span>${item.name}</span><strong>${money(item.price)}</strong></a>`).join('')}</div>`;
        root.appendChild(related);
      }
      const wish = root.querySelector('.wishlist-toggle-btn');
      const saved = window.wellIconWishlistAPI?.isWishlisted(product.id);
      const setWish = added => { wish.setAttribute('aria-pressed', String(added)); wish.setAttribute('aria-label', `${added ? 'Remove' : 'Add'} ${product.name} ${added ? 'from' : 'to'} wishlist`); wish.querySelector('span').textContent = added ? 'favorite' : 'favorite_border'; wish.classList.toggle('is-saved', added); };
      setWish(saved);
      window.wellIconCartAPI?.updateCartUI();
    });
  </script>
</body>
</html>
